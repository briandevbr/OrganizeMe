<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registro</title>
    <link rel="shortcut icon" href="../../Icone.ico" type="image/x-icon">
    <link rel="stylesheet" href="../CSS/cadastro.css">
    <script src="https://kit.fontawesome.com/22a8724ea3.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="regis">
        <h1>CRIAR CONTA</h1>  
        
        <div class="formulario">
            <!-- Tag form corrigida (sem a tag vazia extra) -->
            <form action="cadastro.html" method="post">
                
                <div class="usuario">
                    <label for="nome">Nome Completo:</label> <br>
                    <div class="grupo-input">
                        <div class="input-icon"><i class="fa-regular fa-user"></i></div>
                        <input class="boxtext" type="text" id="nome" name="nome" required>
                    </div>
                </div>  
                   
                <div class="email">
                    <label for="email">Email:</label> <br>
                    <!-- Div grupo-input agora envolve corretamente o ícone e o input -->
                    <div class="grupo-input">
                        <div class="input-icon"><i class="fa-solid fa-envelope"></i></div>
                        <input class="boxtext" type="email" id="email" name="email" required>
                    </div>
                </div>

                <div class="password">
                    <label for="password">Senha:</label> <br>
                    <div class="grupo-input">
                        <div class="input-icon"><i class="fa-solid fa-lock"></i></div>
                        <input class="boxtext" type="password" id="password" name="password" required>
                        <button type="button" class="btn-show-password"><i class="fa-regular fa-eye"></i></button>
                    </div>
                </div>

                <div class="password">
                    <label for="confirm-password">Confirmar Senha:</label> <br>
                    <div class="grupo-input">
                        <div class="input-icon"><i class="fa-regular fa-circle-check"></i></div>
                        <input class="boxtext" type="password" id="confirm-password" name="confirm-password" required>
                        <button type="button" class="btn-show-password"><i class="fa-regular fa-eye"></i></button>
                    </div>
                </div>

            <div class="voltarlogin">
                <p>Já possui conta? <a href="login.html" class="voltaloglink">Entrar</a></p>
            </div>
        </div>
        <input class="botaocad" type="submit" value="Cadastrar Empresa">
    </div>

    <script src="../../back/codigoFonte/cadastro.js"></script>
    
</body>
</html>
