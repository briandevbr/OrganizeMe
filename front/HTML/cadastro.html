<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registro</title>
    <link rel="shortcut icon" href="../../favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../CSS/cadastro.css">
    <script src="https://kit.fontawesome.com/22a8724ea3.js" crossorigin="anonymous"></script>
</head>
<body>
     <div class="regis">
             <h1>CRIAR CONTA</h1>  
        <div class="formulario">
            <div class="usuario">
                 <form> <action="cadastro.html" method="post">
                 <label for="nome">Nome Completo:</label> <br>
                 <input class="boxtext" type="text" id="nome" name="nome" required>
             </div>  
                   
            <div class="email">
             <label for="email">Email:</label> <br>
             <input class="boxtext" type="email" id="email" name="email" required>
             </div>
        
             <div class="company">
             <label class="company"for="company">Nome da Empresa:</label> <br>
             <input class="boxtext" type="name" id="company">
             
             <div class="function">
             <label for="function">Cargo:</label> <br>
            <input class="boxtext" type="text" id="function" name="function" required>
             </div>

             <div class="password">
             <label for="password">Senha:</label> <br>
            <input class="boxtext" type="password" id="password" name="password" required>
             </div>

             <div class="password">
             <label for="confirm-password">Confirmar Senha:</label> <br>
            <input class="boxtext" type="password" id="confirm-password" name="confirm-password" required>
             </div>     
    </div>
        <input class="botaocad" type="submit" value="Cadastrar Empresa">
      <div class="icons">
        <i class="fa-regular fa-address-card"></i>
        <i class="fa-regular fa-user"></i>
        <i class="fa-solid fa-envelope"></i>
        <i class="fa-regular fa-building"></i>
        <i class="fa-solid fa-unlock"></i>
        <i class="fa-regular fa-circle-check"></i>
     </div>
</form>
</body>
</html>
