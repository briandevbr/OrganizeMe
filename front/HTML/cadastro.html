<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registro</title>
    <link rel="shortcut icon" href="../../Icone.ico" type="image/x-icon">
    <link rel="stylesheet" href="../CSS/cadastro.css">
    <script src="https://kit.fontawesome.com/22a8724ea3.js" crossorigin="anonymous"></script>
</head>
<body>
     <div class="regis">
             <h1>CRIAR CONTA</h1>  
        <div class="formulario">
            <div class="usuario">
    <form> <action="cadastro.html" method="post">
                 <label for="nome">Nome Completo:</label> <br>
                 <div class="grupo-input">
                     <i class="fa-regular fa-user"></i>
                     <input class="boxtext" type="text" id="nome" name="nome" required>
                 </div>
                
             </div>  
                   
            <div class="email">
             <label for="email">Email:</label> <br>
            <div class="grupo-input"></div>
                <i class="fa-solid fa-envelope"></i>
                <input class="boxtext" type="email" id="email" name="email" required>
             </div>
            </div>

             <div class="password">
             <label for="password">Senha:</label> <br>
            <div class="grupo-input">
                <i class="fa-solid fa-lock"></i>
                <input class="boxtext" type="password" id="password" name="password" required>
            </div>
             </div>

             <div class="password">
             <label for="confirm-password">Confirmar Senha:</label> <br>
            <div class="grupo-input">
                <i class="fa-regular fa-circle-check"></i>
                <input class="boxtext" type="password" id="confirm-password" name="confirm-password" required>
            </div>
             </div>     
    
        <input class="botaocad" type="submit" value="Cadastrar Empresa">
    </form>
        <div class="voltarlogin">
             <p>Ja possui conta? <a href="login.html" class="voltaloglink">Entrar</a></p>
        </div>
        
        <div class="showsenha">
            <button type="button" id="show-password"><i class="fa-regular fa-eye"></i>
            </button>
        </div>     
</div>
</body>
</html>
