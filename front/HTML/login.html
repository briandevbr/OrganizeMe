<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="shortcut icon" href="../../Icone.ico" type="image/x-icon" />
    <link rel="stylesheet" href="../CSS/login.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://kit.fontawesome.com/YOUR_KIT_CODE.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="regis">
      <h1>Login</h1>
        <a href="../../index.html" class="botao-voltar"> <!-- botão de voltar para a página inicial -->
          <i class="fa-solid fa-angles-left"></i> Voltar
        </a> 
      <div class="email">
        <label for="email">E-mail</label>
        <div class="grupo-input">
        <div class="input-icon"><i class="fa-solid fa-envelope"></i></div>
          <input
            type="email"
            id="email"
            name="email"
            class="boxtext"
            autocomplete="email"
          />
        </div>
      </div>

      <div class="password">
        <label for="password">Senha</label>
        <div class="grupo-input">
          <div class="input-icon"><i class="fa-solid fa-lock"></i></div>
          <input
            type="password"
            id="password"
            name="password"
            class="boxtext"
            autocomplete="current-password"
          />
          <button type="button" id="showpassword" class="btn-show-password"><i class="fa-regular fa-eye" id="icon"></i></button>
        </div>
      </div>

      <button type="submit" class="botaocad">Entrar</button>
       <script src="../../back/codigoFonte/login.js"></script>

      <div class="esqueci-senha">
        <p><a href="#">Esqueci minha senha</a></p>
      </div>

    
      <div class="social-login">
        <ul class="lista-social">
          <li class="item-social">
            <a href="#"><i class="fa-brands fa-facebook"></i></a>
          </li>
          <li class="item-social">
            <a href="#"><i class="fa-brands fa-google"></i></a>
          </li>
          <li class="item-social">
            <a href="#"><i class="fa-brands fa-github"></i></a>
          </li>
        </ul>
      </div>

      <div class="registrar">
        <p>Ainda não possui conta? <a href="cadastro.html">Registre-se</a></p>
      </div>

    </div>
  </body>
</html>
